# Render Blueprint — deploy with "New > Blueprint" pointing at this repo,
# or run `render blueprint launch` from the Render CLI.
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: finpilot-db
    plan: free
    databaseName: finpilot
    user: finpilot_user

services:
  - type: web
    name: finpilot-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finpilot-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      # Set this to your deployed Vercel URL after the frontend is live,
      # e.g. https://finpilot.vercel.app — required for CORS to allow it.
      - key: FRONTEND_ORIGIN
        sync: false
