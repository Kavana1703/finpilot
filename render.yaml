# Render Blueprint — deploy with "New > Blueprint" pointing at this repo,
# or run `render blueprint launch` from the Render CLI.
# Docs: https://render.com/docs/blueprint-spec
#
# NOTE: the database is NOT managed here. Render's free Postgres plan
# auto-deletes after 30 days, so this app uses an external, permanently-free
# Postgres instead (e.g. Neon — neon.tech). DATABASE_URL is set manually in
# the Render dashboard (Environment tab) rather than via `fromDatabase`.

services:
  - type: web
    name: finpilot-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    envVars:
      # Set this manually in Render's dashboard to your Neon connection
      # string, e.g. postgresql://user:pass@ep-xxx.neon.tech/finpilot?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      # Set this to your deployed Vercel URL after the frontend is live,
      # e.g. https://finpilot.vercel.app — required for CORS to allow it.
      - key: FRONTEND_ORIGIN
        sync: false
